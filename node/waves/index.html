<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluxo Poligonal Roxo com Preenchimento</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            /* Fundo bem escuro */
            background-color: #0d001a; 
        }
        canvas { display: block; }
    </style>
</head>
<body>

<canvas id="canvasPoligonos"></canvas>

<script>
const canvas = document.getElementById('canvasPoligonos');
const ctx = canvas.getContext('2d');

let width, height;
let mountains = [];

// --- Configurações ---
const mountainCount = 10; // Aumentei um pouco para ficar mais denso
const speed = 0.0025;     // Um pouco mais lento para apreciar a profundidade
const horizonYRatio = 0.4;
const numPoints = 30;     // Mais pontos para polígonos mais detalhados

// Paleta de cores HSLA
const colors = {
    back: { h: 265, s: 90, l: 10 }, // Roxo profundo quase preto
    front: { h: 285, s: 90, l: 80 } // Lilás claro vibrante
};

function generateMountainShape() {
    let points = [];
    for (let i = 0; i < numPoints; i++) {
        // Multiplicar random por random cria picos mais agudos ocasionais
        points.push(Math.random() * Math.random());
    }
    return points;
}

function init() {
    resize();
    mountains = [];
    for (let i = 0; i < mountainCount; i++) {
        mountains.push({
            z: i / mountainCount,
            shapePoints: generateMountainShape()
        });
    }
    animate();
}

function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
}

function lerp(start, end, t) {
    return start * (1 - t) + end * t;
}

function drawMountain(mountain) {
    // p = progresso (0 = fundo, 1 = frente) com curva para acelerar perto da tela
    const p = 1 - Math.pow(mountain.z, 1.8); 

    const scale = lerp(0.1, 5.0, p);
    const currentHorizonY = height * horizonYRatio;
    const yBase = lerp(currentHorizonY, height * 1.3, p);
    const amplitude = lerp(0, 800, p);
    
    // Cálculos de Cor
    const h = lerp(colors.back.h, colors.front.h, p);
    const l = lerp(colors.back.l, colors.front.l, p);
    
    // Alpha base para a linha (fica totalmente opaco na frente)
    const strokeAlpha = lerp(0, 1, p * p * p); 
    // Alpha do preenchimento é uma fração do alpha da linha (ex: 30% da força)
    // Isso garante que o preenchimento seja sempre mais sutil que a linha.
    const fillAlpha = strokeAlpha * 0.3;

    // Configura estilos
    ctx.strokeStyle = `hsla(${h}, 80%, ${l}%, ${strokeAlpha})`;
    ctx.fillStyle = `hsla(${h}, 80%, ${l}%, ${fillAlpha})`; // Cor de preenchimento
    
    ctx.lineWidth = lerp(0.8, 1, p);
    ctx.lineJoin = 'bevel';

    ctx.beginPath();
    
    const projectedWidth = width * scale;
    const startX = (width - projectedWidth) / 2;
    const segmentWidth = projectedWidth / (numPoints - 1);
    let lastX = 0; // Variável para guardar a última posição X

    // Desenha os picos superiores
    for (let i = 0; i < numPoints; i++) {
        const x = startX + (i * segmentWidth);
        const y = yBase - (mountain.shapePoints[i] * amplitude);

        if (i === 0) {
            ctx.moveTo(x, y);
        } else {
            ctx.lineTo(x, y);
        }
        lastX = x; // Atualiza a última posição X
    }

    // --- FECHAR O POLÍGONO PARA PREENCHIMENTO ---
    // Desenha uma linha do último pico até bem abaixo da tela
    ctx.lineTo(lastX, height * 2);
    // Desenha uma linha até bem abaixo do ponto inicial
    ctx.lineTo(startX, height * 2);
    // Fecha o caminho voltando ao primeiro ponto (moveTo inicial)
    ctx.closePath();

    // --- DESENHAR ---
    // Preencher PRIMEIRO para que as linhas fiquem por cima
    ctx.fill(); 
    // Desenhar as linhas DEPOIS
    ctx.stroke();
}

function animate() {
    // Limpa a tela (usando um clearRect total para evitar rastros do preenchimento)
    ctx.clearRect(0, 0, width, height); 
    
    // Opcional: Redesenhar um fundo sólido se quiser mudar a cor base
    ctx.fillStyle = '#0d001a';
    ctx.fillRect(0,0, width, height);

    mountains.sort((a, b) => b.z - a.z); // Desenha do fundo para a frente

    mountains.forEach(m => {
        drawMountain(m);
        m.z -= speed;
        if (m.z <= 0) {
            m.z = 1;
            m.shapePoints = generateMountainShape();
        }
    });
    
    requestAnimationFrame(animate);
}

window.addEventListener('resize', resize);
init();
</script>

</body>
</html>
