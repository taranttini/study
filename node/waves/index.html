<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluxo de Ondas ou Poligono</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000 }
        canvas { display: block; }
    </style>
</head>
<body>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const bg = new Image()
bg.src = "img1.jpeg"
bg.onload = function() {
    console.log('load img')
    ctx.drawImage(bg,0,0,canvas.width, canvas.height)
}

let width, height;
let waves = [];

// --- Configurações ---
const waveCount = 8;     // Total de ondas na tela
const speed = 0.003;       // Velocidade do fluxo
const numPoints = 60;       // Menos pontos para formas mais simples e largas
const horizonY = 0.3;      // Ponto de origem no topo (30% da tela)


const colors = {
    back: { h: 230, s: 80, l: 15 }, // Roxo escuro
    front: { h: 245, s: 90, l: 75 }, // Lilás claro
    bg: {h: 230, s: 100, l: 3}
};
const colors3 = {
    back: { h: 270, s: 80, l: 15 }, // Roxo escuro
    front: { h: 285, s: 90, l: 75 }, // Lilás claro
    bg: {h: 270, s: 100, l: 3}
};

const colors2 = {
    back: { h: 190, s: 25, l: 15 }, // Roxo escuro
    front: { h: 190, s: 90, l: 75 }, // Lilás claro
    bg: {h: 195, s: 100, l: 3}
};
var background =  "#000";
function init() {
    background = `hsl(${colors.bg.h}, ${colors.bg.s}% , ${colors.bg.l}%)`;
    document.body.style.backgroundColor= background
    resize();
    waves = [];
    for (let i = 0; i < waveCount; i++) {
        waves.push({
            z: i / waveCount,
            points: Array.from({length: numPoints}, () => Math.random())
        });
    }
    animate();
}

function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
}

function drawWave(wave) {

    

    // p vai de 0 (horizonte) a 1 (passou pelo observador)
    const p = 1 - wave.z;

    // Perspectiva: a onda desce e expande conforme p aumenta
    // 6 ou 10
    const scale = 1 + p * 2; 
    const yBase = (height * horizonY) + (p * p * height * 1.2);
    const amplitude = 10 + p * 150;

    const h = (colors.back.h + (colors.front.h - colors.back.h) * p);
    const l = (colors.back.l + (colors.front.l - colors.back.l) * p);
    const alpha = Math.pow(p, 0.8); // .3 ou .8 // Aparece suavemente no fundo

    ctx.strokeStyle = `hsla(${h}, 100%, ${l}%, ${alpha})`; //.9)` //
    ctx.fillStyle = `hsla(${h}, 80%, ${l}%, ${alpha * 0.10})`; // Preenchimento transparente
    ctx.lineWidth = -.8 + p * 1.2;
    //ctx.lineJoin = 'bevel';

    const waveWidth = width * scale;
    const startX = (width - waveWidth) / 2;
    const step = waveWidth / (numPoints - 1);

    ctx.beginPath();
    
    // Ponto inicial (canto inferior esquerdo para fechar o preenchimento)
    ctx.moveTo(startX, height * 2); 
    
    // Coordenadas dos pontos da onda
    const coords = wave.points.map((val, i) => ({
        x: startX + i * step,
        y: yBase - (val * amplitude)
    }));

    // Desenha a linha arredondada usando curvas
    ctx.lineTo(coords[0].x, coords[0].y);

    for (let i = 0; i < coords.length - 1; i++) {
        const xc = (coords[i].x + coords[i + 1].x) / 2;
        const yc = (coords[i].y + coords[i + 1].y) / 2;

        linhaRedonda(ctx, coords, i, xc, yc)
        //linhaPoligno(ctx, i, xc, yc) 
    }
    
    // Finaliza a curva até o último ponto
    const last = coords[coords.length - 1];
    ctx.lineTo(last.x, last.y);

    // Fecha o polígono lá embaixo para o preenchimento
    ctx.lineTo(last.x, height * 2);
    ctx.closePath();

    ctx.fill();
    ctx.stroke();

     
}

function linhaRedonda(ctx, coords, i, xc, yc) {
    ctx.quadraticCurveTo(coords[i].x, coords[i].y, xc, yc);
}

function linhaPoligno(ctx, i, xc, yc) {
    if (i === 0) {
        ctx.moveTo(xc, yc);
    } else {
        ctx.lineTo(xc, yc);
    }
}

function animate() {
    // Limpa com um leve rastro escuro
    ctx.fillStyle = background;
    ctx.fillRect(0, 0, width, height);

    // Ordena para desenhar as de trás primeiro
    waves.sort((a, b) => b.z - a.z);

    //ctx.drawImage(bg,0,0,canvas.width, canvas.height)

    waves.forEach(wave => {
        drawWave(wave);
        
        // Move para frente
        wave.z -= speed;

        // Se a onda "passou" por nós (z < 0), ela volta para o horizonte (z = 1)
        if (wave.z <= 0) {
            wave.z = 1;
            wave.points = Array.from({length: numPoints}, () => Math.random());
        }
    });

    requestAnimationFrame(animate);
}

window.addEventListener('resize', resize);
init();
</script>

</body>
</html>
